name: Build portfogram-batch (build-only)
# Build-only 전략:
# - 이미지를 빌드하고 Docker Hub에 푸시하는 것까지만 수행
# - manifest repo에 태그를 커밋하지 않음 → ArgoCD가 sync하지 않음
# - 상시 실행되는 Deployment 없이, 필요할 때 k8s Job / CronJob으로 실행
# - 예시: kubectl create job stats-batch --image=minimeisme/portfogram-batch:SHA -n portfogram

on:
  push:
    branches:
      - main
    paths:
      - 'portfogram-batch/**'
      - 'common/**'

env:
  DOCKER_REGISTRY: docker.io
  IMAGE_REPO: minimeisme/portfogram-batch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Source code checkout
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker registry login
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./portfogram-batch/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:${{ github.sha }}
            ${{ env.IMAGE_REPO }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print usage guide
        run: |
          echo "Image built: ${{ env.IMAGE_REPO }}:${{ github.sha }}"
          echo ""
          echo "Run on-demand:"
          echo "  kubectl create job portfolio-stats-$(date +%Y%m%d) \\"
          echo "    --image=${{ env.IMAGE_REPO }}:${{ github.sha }} \\"
          echo "    -n portfogram \\"
          echo "    -- java -javaagent:/opentelemetry-javaagent.jar -jar /app.jar \\"
          echo "       --spring.batch.job.names=portfolioStatsSummaryJob"
