name: Build and Deploy portfogram-auth

on:
  push:
    branches:
      - main
    paths:
      - 'portfogram-auth/**'
      - 'common/**'

env:
  DOCKER_REGISTRY: docker.io
  IMAGE_REPO: minimeisme/portfogram-auth

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Source code checkout
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker registry login
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./portfogram-auth/Dockerfile
          push: true
          tags: ${{ env.IMAGE_REPO }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Checkout manifest repository
        uses: actions/checkout@v3
        with:
          repository: minina0407/portfogram-manifest
          token: ${{ secrets.MANIFEST_REPO_TOKEN }}
          path: manifest-repo

      - name: Update image tag
        run: |
          sed -i 's/tag: .*/tag: "${{ github.sha }}"/' \
            manifest-repo/apps/spring-boot/values-portfogram-auth-dev.yaml

      - name: Commit and push manifest changes
        run: |
          cd manifest-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/spring-boot/values-portfogram-auth-dev.yaml
          git diff --staged --quiet || \
            git commit -m "chore(portfogram-auth): update image tag to ${{ github.sha }}" && git push
