name: Build and Deploy portfogram-auth
# manifest repo 업데이트는 ArgoCD Image Updater가 담당함 (CI가 직접 git push하지 않음).
# 이전엔 api/auth/chat 워크플로우가 동시에 manifest repo main에 push하면서
# 'cannot lock ref' 경합이 발생했음 -> Image Updater로 write 주체를 단일화해서 해결.

on:
  push:
    branches:
      - main
    paths:
      - 'portfogram-auth/**'
      - 'common/**'
  workflow_dispatch:

env:
  DOCKER_REGISTRY: docker.io
  IMAGE_REPO: minimeisme/portfogram-auth

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Source code checkout
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker registry login
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./portfogram-auth/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE_REPO }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
