// shared library - bootJar disabled
apply plugin: 'java-library'
jar { enabled = true }

dependencies {
    api 'org.springframework.boot:spring-boot-starter-data-jpa'
    api 'org.springframework.boot:spring-boot-starter-security'
    api 'org.springframework.boot:spring-boot-starter-validation'
    api 'org.springframework.boot:spring-boot-starter-web'
    api 'org.springframework.boot:spring-boot-starter-data-redis'
    api 'org.springframework.boot:spring-boot-starter-cache'
    api 'org.springframework.boot:spring-boot-starter-actuator'
    api 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0'
    api "io.micrometer:micrometer-registry-prometheus"
    api 'net.logstash.logback:logstash-logback-encoder:7.0'
    api 'com.fasterxml.jackson.core:jackson-databind:2.15.0'
    api 'io.jsonwebtoken:jjwt-api:0.11.5'
    api "io.opentelemetry:opentelemetry-api:${opentelemetryVersion}"
    api "io.opentelemetry:opentelemetry-sdk:${opentelemetryVersion}"
    api "io.opentelemetry:opentelemetry-exporter-otlp:${opentelemetryVersion}"
    api "io.opentelemetry:opentelemetry-semconv:${opentelemetryVersion}-alpha"
    api "io.opentelemetry.instrumentation:opentelemetry-instrumentation-annotations:${opentelemetryInstrumentationVersion}"
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'
    runtimeOnly 'com.mysql:mysql-connector-j:8.3.0'
    testImplementation 'org.springframework.security:spring-security-test'
}
